
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f0f0ff;
            padding-top: 50px;
        }

        button {
            background: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #game {
            display: none;
            margin-top: 30px;
        }

        #game button {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website!</h1>
    <p>I am learning GitHub.</p>

    <button onclick="showMessage()">Click Me</button>

    <div id="game">
        <h2>🎮 Welcome to the Game!</h2>
        <p>Guess a number between 1 and 5.</p>

        <input type="number" id="guess" min="1" max="5">
        <button onclick="playGame()">Submit</button>

        <p id="result"></p>
    </div>

    <script>
        function showMessage() {
            alert("Congratulations! Your system has been hacked by a professional hacker. Don't try to go back your details will be leaked to public so be here and wait for 30sec and see the twist");

            // Game appears ONLY after clicking OK
            document.getElementById("game").style.display = "block";
        }

        function playGame() {
            let number = Math.floor(Math.random() * 5) + 1;
            let guess = Number(document.getElementById("guess").value);

            if (guess === number) {
                document.getElementById("result").innerHTML =
                    "🎉 Congratulations! You won!";
            } else {
                document.getElementById("result").innerHTML =
                    "😅 Try again! The number was " + number;
            }
        }
    </script>

</body>
</html>
